<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kenteken Scanner - Gestolen Check</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b1a2e;
            color: #e0e8f0;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #1a2a3f;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 0.25rem;
            color: #7ec8f0;
        }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #8aa4c0;
            margin-bottom: 1.5rem;
        }
        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #0a1420;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 1rem;
            border: 2px solid #2a4a6a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        #video.active {
            display: block;
        }
        #canvas {
            display: none;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }
        #overlayCanvas.active {
            display: block;
        }
        .camera-placeholder {
            color: #4a6a8a;
            text-align: center;
            padding: 1rem;
        }
        .camera-placeholder .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 3px dashed rgba(126, 200, 240, 0.3);
            pointer-events: none;
            display: none;
        }
        .scan-overlay.active {
            display: block;
        }
        .scan-overlay .label {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: rgba(126, 200, 240, 0.8);
            background: rgba(10, 20, 32, 0.8);
            padding: 4px 16px;
            border-radius: 20px;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }
        .controls {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 80px;
        }
        .btn-primary {
            background: #1e6f9f;
            color: white;
        }
        .btn-primary:hover {
            background: #155a82;
        }
        .btn-success {
            background: #2a9d6a;
            color: white;
        }
        .btn-success:hover {
            background: #1e7a52;
        }
        .btn-danger {
            background: #b33c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #8f2e2e;
        }
        .btn-warning {
            background: #f0a030;
            color: #1a2a3f;
        }
        .btn-warning:hover {
            background: #d48a20;
        }
        .btn-outline {
            background: transparent;
            color: #7ec8f0;
            border: 2px solid #2a4a6a;
        }
        .btn-outline:hover {
            background: #1a2a3f;
        }
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        #kentekenInput {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 2px solid #2a4a6a;
            background: #0f1f30;
            color: #e0e8f0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
        #kentekenInput:focus {
            outline: none;
            border-color: #7ec8f0;
        }
        #kentekenInput::placeholder {
            color: #4a6a8a;
            letter-spacing: 1px;
            font-weight: 400;
        }
        .result-box {
            background: #0f1f30;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 0.5rem;
            min-height: 80px;
            border-left: 4px solid #2a4a6a;
            word-wrap: break-word;
        }
        .result-box .status {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .result-box .status.gestolen {
            color: #ff6b6b;
        }
        .result-box .status.schoon {
            color: #4ecdc4;
        }
        .result-box .status.fout {
            color: #ffa94d;
        }
        .result-box .details {
            font-size: 0.9rem;
            color: #8aa4c0;
            margin-top: 0.4rem;
            line-height: 1.5;
        }
        .result-box .details strong {
            color: #c0d8e8;
        }
        .result-box .debug {
            font-size: 0.7rem;
            color: #6a8aa0;
            margin-top: 0.5rem;
            border-top: 1px solid #2a4a6a;
            padding-top: 0.5rem;
            overflow-x: auto;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 150px;
            overflow-y: auto;
        }
        .loading {
            color: #7ec8f0;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .loading .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2a4a6a;
            border-top: 3px solid #7ec8f0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #4a6a8a;
            margin-top: 1rem;
        }
        .hint {
            font-size: 0.8rem;
            color: #f0a030;
            margin-top: 0.5rem;
            text-align: center;
        }
        .scan-status {
            font-size: 0.8rem;
            color: #7ec8f0;
            text-align: center;
            margin-bottom: 0.5rem;
            padding: 0.3rem;
            background: #0f1f30;
            border-radius: 8px;
        }
        .detection-box {
            position: absolute;
            border: 4px solid #4ecdc4;
            border-radius: 8px;
            pointer-events: none;
            display: none;
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.4);
            background: rgba(78, 205, 196, 0.05);
            z-index: 10;
        }
        .detection-box.active {
            display: block;
        }
        .detection-box .label {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            font-weight: 700;
            color: #4ecdc4;
            background: rgba(10, 20, 32, 0.9);
            padding: 2px 12px;
            border-radius: 12px;
            white-space: nowrap;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .rdw-link {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.3rem 0.8rem;
            background: #1e6f9f;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .rdw-link:hover {
            background: #155a82;
        }
        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            .btn {
                font-size: 0.8rem;
                padding: 0.6rem 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 Kenteken Scanner</h1>
        <p class="subtitle">Automatisch scannen en checken of voertuig gestolen is</p>

        <!-- Camera -->
        <div class="camera-container" id="cameraContainer">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
            <div class="detection-box" id="detectionBox">
                <span class="label">🔍 Kenteken</span>
            </div>
            <div class="camera-placeholder" id="cameraPlaceholder">
                <span class="icon">📸</span>
                <p>Klik op <strong>"Start camera"</strong> om de scanner te activeren</p>
            </div>
            <div class="scan-overlay active" id="scanOverlay">
                <span class="label">📷 Scan volledig beeld</span>
            </div>
        </div>

        <!-- Knoppen -->
        <div class="controls">
            <button id="toggleCameraBtn" class="btn btn-warning">📷 Start camera</button>
            <button id="manualScanBtn" class="btn btn-primary" disabled>📸 Scan nu</button>
        </div>

        <!-- Handmatige invoer -->
        <div class="input-group">
            <input type="text" id="kentekenInput" placeholder="Of typ handmatig: 12-ABC-3" maxlength="12" />
            <button id="checkBtn" class="btn btn-success">🔍 Check</button>
        </div>

        <!-- Scan status -->
        <div class="scan-status" id="scanStatus">⏸️ Camera gestopt</div>

        <!-- Resultaat -->
        <div class="result-box" id="resultBox">
            <div style="color:#4a6a8a; text-align:center; padding:0.5rem;">
                Scan een kenteken of typ deze handmatig in
            </div>
        </div>
        <div class="hint" id="hintMessage"></div>
        <div class="footer">Data afkomstig van RDW Open Data · Alleen ter controle</div>
    </div>

    <script>
        (function() {
            'use strict';

            // --- DOM refs ---
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const overlayCanvas = document.getElementById('overlayCanvas');
            const overlayCtx = overlayCanvas.getContext('2d');
            const toggleCameraBtn = document.getElementById('toggleCameraBtn');
            const manualScanBtn = document.getElementById('manualScanBtn');
            const kentekenInput = document.getElementById('kentekenInput');
            const checkBtn = document.getElementById('checkBtn');
            const resultBox = document.getElementById('resultBox');
            const cameraPlaceholder = document.getElementById('cameraPlaceholder');
            const scanOverlay = document.getElementById('scanOverlay');
            const hintMessage = document.getElementById('hintMessage');
            const scanStatus = document.getElementById('scanStatus');
            const detectionBox = document.getElementById('detectionBox');

            // --- State ---
            let cameraStream = null;
            let cameraActive = false;
            let scanInterval = null;
            let lastScannedKenteken = '';
            let isProcessing = false;
            let detectionTimeout = null;

            // --- Camera ---
            async function startCamera() {
                try {
                    if (cameraStream) {
                        cameraStream.getTracks().forEach(t => t.stop());
                        cameraStream = null;
                    }
                    const constraints = {
                        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
                    };
                    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = cameraStream;
                    await video.play();
                    cameraActive = true;
                    video.classList.add('active');
                    overlayCanvas.classList.add('active');
                    cameraPlaceholder.style.display = 'none';
                    scanOverlay.classList.add('active');
                    toggleCameraBtn.textContent = '📷 Stop camera';
                    toggleCameraBtn.className = 'btn btn-danger';
                    manualScanBtn.disabled = false;
                    scanStatus.textContent = '🔄 Scannen actief... wacht op kenteken';
                    hintMessage.textContent = '✅ Camera actief – automatisch scannen gestart';
                    startAutoScan();
                    return true;
                } catch (err) {
                    console.error('Camera error:', err);
                    let msg = '⚠️ Geen camera-toegang. ';
                    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        msg += 'Je hebt de cameratoestemming geweigerd. Geef toestemming in je browserinstellingen.';
                    } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                        msg += 'Geen camera gevonden op dit apparaat.';
                    } else {
                        msg += 'Fout: ' + err.message;
                    }
                    hintMessage.textContent = msg;
                    setResult('❌ ' + msg, 'fout');
                    return false;
                }
            }

            function stopCamera() {
                if (scanInterval) {
                    clearInterval(scanInterval);
                    scanInterval = null;
                }
                if (detectionTimeout) {
                    clearTimeout(detectionTimeout);
                    detectionTimeout = null;
                }
                if (cameraStream) {
                    cameraStream.getTracks().forEach(t => t.stop());
                    cameraStream = null;
                }
                video.srcObject = null;
                video.classList.remove('active');
                overlayCanvas.classList.remove('active');
                cameraActive = false;
                cameraPlaceholder.style.display = 'block';
                scanOverlay.classList.remove('active');
                toggleCameraBtn.textContent = '📷 Start camera';
                toggleCameraBtn.className = 'btn btn-warning';
                manualScanBtn.disabled = true;
                scanStatus.textContent = '⏸️ Camera gestopt';
                hintMessage.textContent = 'Camera gestopt. Klik op "Start camera" om opnieuw te beginnen.';
                detectionBox.classList.remove('active');
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            }

            async function toggleCamera() {
                if (cameraActive) {
                    stopCamera();
                } else {
                    await startCamera();
                }
            }

            // --- Kleurdetectie (geel/blauw) ---
            function findPlateRegion(imageData, width, height) {
                const data = imageData.data;
                let minX = width,
                    minY = height,
                    maxX = 0,
                    maxY = 0;
                let found = false;
                const step = 4;

                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const idx = (y * width + x) * 4;
                        const r = data[idx];
                        const g = data[idx + 1];
                        const b = data[idx + 2];

                        const isYellow = (r > 150 && g > 150 && b < 100 && r > b + 30 && g > b + 30);
                        const isBlue = (b > 100 && r < 120 && g < 120 && b > r + 30 && b > g + 30);

                        if (isYellow || isBlue) {
                            found = true;
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }

                if (found && maxX - minX > 20 && maxY - minY > 20) {
                    const margin = 20;
                    return {
                        x: Math.max(0, minX - margin),
                        y: Math.max(0, minY - margin),
                        w: Math.min(width - minX + margin, maxX - minX + margin * 2),
                        h: Math.min(height - minY + margin, maxY - minY + margin * 2)
                    };
                }
                return null;
            }

            // --- Validatie Nederlands kenteken ---
            function isValidDutchLicensePlate(plate) {
                const clean = plate.replace(/[- ]/g, '').toUpperCase();
                if (!/^[A-Z0-9]{6,9}$/.test(clean)) return false;
                const patterns = [
                    /^[A-Z]{2}[0-9]{2}[A-Z]{2}$/,
                    /^[A-Z]{2}[0-9]{3}[A-Z]{1}$/,
                    /^[A-Z]{1}[0-9]{3}[A-Z]{2}$/,
                    /^[0-9]{2}[A-Z]{2}[0-9]{2}$/,
                    /^[0-9]{2}[A-Z]{3}[0-9]{1}$/,
                    /^[0-9]{1}[A-Z]{3}[0-9]{2}$/,
                    /^[A-Z]{3}[0-9]{2}[A-Z]{1}$/,
                    /^[A-Z]{1}[0-9]{2}[A-Z]{3}$/
                ];
                return patterns.some(p => p.test(clean));
            }

            // --- Toon detectiekader ---
            function showDetectionBox(bbox) {
                if (!bbox) {
                    detectionBox.classList.remove('active');
                    overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                    return;
                }

                overlayCanvas.width = video.videoWidth || 640;
                overlayCanvas.height = video.videoHeight || 480;
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                const x = bbox.x0 || 0;
                const y = bbox.y0 || 0;
                const w = (bbox.x1 || 0) - x;
                const h = (bbox.y1 || 0) - y;

                if (w > 10 && h > 10) {
                    overlayCtx.strokeStyle = '#4ecdc4';
                    overlayCtx.lineWidth = 4;
                    overlayCtx.shadowColor = 'rgba(78,205,196,0.6)';
                    overlayCtx.shadowBlur = 20;
                    overlayCtx.strokeRect(x, y, w, h);
                    overlayCtx.shadowBlur = 0;
                    detectionBox.classList.remove('active');
                } else {
                    detectionBox.classList.remove('active');
                }
            }

            // --- OCR en kentekenherkenning ---
            async function performScan() {
                if (!cameraActive || isProcessing) return;
                isProcessing = true;

                try {
                    const captureWidth = 640;
                    const captureHeight = 480;
                    canvas.width = captureWidth;
                    canvas.height = captureHeight;
                    ctx.drawImage(video, 0, 0, captureWidth, captureHeight);

                    const imageData = ctx.getImageData(0, 0, captureWidth, captureHeight);
                    const plateRegion = findPlateRegion(imageData, captureWidth, captureHeight);

                    let cropCanvas = canvas;
                    let cropX = 0,
                        cropY = 0,
                        cropW = captureWidth,
                        cropH = captureHeight;

                    if (plateRegion) {
                        cropX = plateRegion.x;
                        cropY = plateRegion.y;
                        cropW = plateRegion.w;
                        cropH = plateRegion.h;

                        const scaleX = video.videoWidth / captureWidth;
                        const scaleY = video.videoHeight / captureHeight;
                        showDetectionBox({
                            x0: cropX * scaleX,
                            y0: cropY * scaleY,
                            x1: (cropX + cropW) * scaleX,
                            y1: (cropY + cropH) * scaleY
                        });

                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = cropW;
                        tempCanvas.height = cropH;
                        const tempCtx = tempCanvas.getContext('2d');
                        tempCtx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
                        cropCanvas = tempCanvas;
                    } else {
                        showDetectionBox(null);
                    }

                    const result = await Tesseract.recognize(
                        cropCanvas,
                        'nld', {
                            logger: (m) => {},
                            tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789- ',
                            tessedit_pageseg_mode: '7',
                            tessedit_ocr_engine_mode: '3'
                        }
                    );

                    const text = result.data.text;

                    const patterns = [
                        /\b[A-Z]{2}[- ]?[0-9]{2}[- ]?[A-Z]{2}\b/i,
                        /\b[A-Z]{2}[- ]?[0-9]{3}[- ]?[A-Z]{1}\b/i,
                        /\b[A-Z]{1}[- ]?[0-9]{3}[- ]?[A-Z]{2}\b/i,
                        /\b[0-9]{2}[- ]?[A-Z]{2}[- ]?[0-9]{2}\b/i,
                        /\b[0-9]{2}[- ]?[A-Z]{3}[- ]?[0-9]{1}\b/i,
                        /\b[0-9]{1}[- ]?[A-Z]{3}[- ]?[0-9]{2}\b/i,
                        /\b[A-Z]{3}[- ]?[0-9]{2}[- ]?[A-Z]{1}\b/i,
                        /\b[A-Z]{1}[- ]?[0-9]{2}[- ]?[A-Z]{3}\b/i,
                        /\b[A-Z]{2}[0-9]{2}[A-Z]{2}\b/i,
                        /\b[A-Z]{2}[0-9]{3}[A-Z]{1}\b/i,
                        /\b[A-Z]{1}[0-9]{3}[A-Z]{2}\b/i,
                        /\b[0-9]{2}[A-Z]{2}[0-9]{2}\b/i,
                        /\b[0-9]{2}[A-Z]{3}[0-9]{1}\b/i,
                        /\b[0-9]{1}[A-Z]{3}[0-9]{2}\b/i,
                        /\b[A-Z]{3}[0-9]{2}[A-Z]{1}\b/i,
                        /\b[A-Z]{1}[0-9]{2}[A-Z]{3}\b/i
                    ];

                    let kentekenMatch = null;
                    for (const pattern of patterns) {
                        const match = text.match(pattern);
                        if (match) {
                            kentekenMatch = match;
                            break;
                        }
                    }

                    if (kentekenMatch) {
                        let kenteken = kentekenMatch[0].toUpperCase().replace(/\s/g, '');
                        const clean = kenteken.replace(/[- ]/g, '');

                        if (clean.length === 6) {
                            kenteken = clean.slice(0, 2) + '-' + clean.slice(2, 4) + '-' + clean.slice(4);
                        } else if (clean.length === 7) {
                            kenteken = clean.slice(0, 2) + '-' + clean.slice(2, 5) + '-' + clean.slice(5);
                        } else if (clean.length === 8) {
                            kenteken = clean.slice(0, 3) + '-' + clean.slice(3, 5) + '-' + clean.slice(5);
                        } else if (clean.length === 9) {
                            kenteken = clean.slice(0, 3) + '-' + clean.slice(3, 6) + '-' + clean.slice(6);
                        }

                        if (isValidDutchLicensePlate(kenteken)) {
                            if (kenteken !== lastScannedKenteken) {
                                lastScannedKenteken = kenteken;
                                kentekenInput.value = kenteken;
                                scanStatus.textContent = `🔍 Kenteken gevonden: ${kenteken} - checken...`;
                                await checkKenteken(kenteken);

                                if (detectionTimeout) clearTimeout(detectionTimeout);
                                detectionTimeout = setTimeout(() => {
                                    showDetectionBox(null);
                                    detectionTimeout = null;
                                }, 2000);

                                setTimeout(() => {
                                    if (lastScannedKenteken === kenteken) {
                                        lastScannedKenteken = '';
                                        scanStatus.textContent = '🔄 Scannen actief... wacht op kenteken';
                                    }
                                }, 3000);
                            }
                        } else {
                            scanStatus.textContent = '🔄 Scannen actief... geen geldig kenteken gevonden';
                        }
                    } else {
                        if (!scanStatus.textContent.includes('wacht op kenteken')) {
                            scanStatus.textContent = '🔄 Scannen actief... wacht op kenteken';
                        }
                        showDetectionBox(null);
                    }
                } catch (err) {
                    console.error('Scan error:', err);
                } finally {
                    isProcessing = false;
                }
            }

            // --- Automatisch scannen ---
            function startAutoScan() {
                if (scanInterval) clearInterval(scanInterval);
                scanInterval = setInterval(() => {
                    if (!cameraActive || isProcessing) return;
                    performScan();
                }, 400);
            }

            // --- Handmatige scan ---
            async function manualScan() {
                if (!cameraActive || isProcessing) return;
                await performScan();
            }

            // --- VERBETERDE RDW CHECK - Doorzoekt alle velden ---
            async function checkKenteken(kenteken) {
                const clean = kenteken.replace(/[- ]/g, '').toUpperCase();
                if (!/^[A-Z0-9]{6,9}$/.test(clean)) {
                    setResult('⚠️ Ongeldig kentekenformaat.', 'fout');
                    return;
                }

                setResult('🔄 Controleren bij RDW...', 'loading');

                try {
                    // Query met $select=* om alle velden op te halen
                    const url =
                        `https://opendata.rdw.nl/resource/m9d7-ebf2.json?kenteken=${clean}&$select=*`;
                    const response = await fetch(url);

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();

                    if (!data || data.length === 0) {
                        setResult('❌ Kenteken niet gevonden in RDW-register.', 'fout');
                        scanStatus.textContent = `❌ ${kenteken} niet gevonden`;
                        return;
                    }

                    const voertuig = data[0];

                    // Zoek naar status in alle velden
                    let gevondenStatus = null;
                    let isGestolen = false;

                    // Doorloop alle sleutels van het object
                    for (const [key, value] of Object.entries(voertuig)) {
                        if (value && typeof value === 'string') {
                            const lower = value.toLowerCase();
                            if (lower.includes('gestolen') || lower.includes('ontvreemd') || lower.includes('diefstal')) {
                                isGestolen = true;
                                gevondenStatus = value;
                                break;
                            }
                        }
                    }

                    // Als we geen status hebben gevonden, gebruik dan voertuigstatus
                    if (!gevondenStatus && voertuig.voertuigstatus) {
                        gevondenStatus = voertuig.voertuigstatus;
                        if (gevondenStatus.toLowerCase().includes('gestolen') ||
                            gevondenStatus.toLowerCase().includes('ontvreemd') ||
                            gevondenStatus.toLowerCase().includes('diefstal')) {
                            isGestolen = true;
                        }
                    }

                    // Als nog steeds geen status, gebruik dan een standaardwaarde
                    if (!gevondenStatus) {
                        gevondenStatus = 'Onbekend';
                    }

                    // Bouw resultaat
                    let html = '';
                    if (isGestolen) {
                        html +=
                            `<div class="status gestolen">🚨 GESTOLEN! Dit voertuig staat geregistreerd als gestolen.</div>`;
                        scanStatus.textContent = `🚨 ${kenteken} - GESTOLEN!`;
                    } else {
                        html +=
                            `<div class="status schoon">✅ Geen diefstalregistratie gevonden voor dit voertuig.</div>`;
                        scanStatus.textContent = `✅ ${kenteken} - schoon (status: ${gevondenStatus})`;
                    }

                    // Toon voertuigdetails
                    html += `<div class="details">`;
                    html += `<strong>Kenteken:</strong> ${voertuig.kenteken || clean}<br>`;
                    html += `<strong>Merk:</strong> ${voertuig.merk || 'Onbekend'}<br>`;
                    html += `<strong>Handelsbenaming:</strong> ${voertuig.handelsbenaming || 'Onbekend'}<br>`;
                    html += `<strong>Voertuigsoort:</strong> ${voertuig.voertuigsoort || 'Onbekend'}<br>`;
                    if (voertuig.vervaldatum_apk) {
                        html += `<strong>APK vervaldatum:</strong> ${voertuig.vervaldatum_apk}<br>`;
                    }
                    html += `<strong>Status voertuig:</strong> ${gevondenStatus}`;

                    // Link naar RDW site
                    html +=
                        `<br><a href="https://ovi.rdw.nl/default.aspx?kenteken=${clean}" target="_blank" class="rdw-link">🔗 Controleer op RDW-site</a>`;
                    html += `</div>`;

                    setResult(html, isGestolen ? 'gestolen' : 'schoon');

                } catch (err) {
                    console.error('RDW API error:', err);
                    setResult('❌ Fout bij RDW-query: ' + err.message, 'fout');
                    scanStatus.textContent = '❌ Fout bij RDW-check';
                }
            }

            // --- UI helpers ---
            function setResult(html, type) {
                if (type === 'loading') {
                    resultBox.innerHTML = `<div class="loading"><span class="spinner"></span> ${html}</div>`;
                } else {
                    resultBox.innerHTML = html;
                    resultBox.className = 'result-box';
                    if (type === 'gestolen') resultBox.style.borderLeftColor = '#ff6b6b';
                    else if (type === 'schoon') resultBox.style.borderLeftColor = '#4ecdc4';
                    else resultBox.style.borderLeftColor = '#ffa94d';
                }
            }

            // --- Event listeners ---
            toggleCameraBtn.addEventListener('click', toggleCamera);
            manualScanBtn.addEventListener('click', manualScan);

            checkBtn.addEventListener('click', () => {
                const kenteken = kentekenInput.value.trim();
                if (kenteken) checkKenteken(kenteken);
                else setResult('⚠️ Voer een kenteken in.', 'fout');
            });

            kentekenInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') checkBtn.click();
            });

            // --- Init ---
            scanOverlay.classList.add('active');
            hintMessage.textContent = 'Klik op "Start camera" om te beginnen. Gebruik "Scan nu" voor handmatige scan.';
            setResult('📱 Klik op "Start camera" en geef toestemming voor de camera.', '');
            console.log('Kenteken Scanner gestart met verbeterde RDW check (alle velden).');
        })();
    </script>
</body>
</html>
